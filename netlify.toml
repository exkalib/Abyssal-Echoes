[build]
  publish = "prototype"
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app-update/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
