[build]
  publish = "prototype"
  command = "npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 网页与云存档都留在同一个 Netlify 项目内，不再转发到旧服务器。
[[redirects]]
  from = "/api/cloud-save"
  to = "/.netlify/functions/cloud-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/cloud-save/health"
  to = "/.netlify/functions/cloud-save-health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app-update/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
