name: Publish Android release

on:
  push:
    tags:
      - "android-v*"
      - "game-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download signed release metadata
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output manifest.json \
            http://59.110.144.30:9091/app-update/manifest.json
          curl --fail --location --retry 4 --retry-delay 3 \
            --output manifest.sig \
            http://59.110.144.30:9091/app-update/manifest.sig
          bundle_name="$(jq -r '.bundle // empty' manifest.json)"
          [[ "$bundle_name" =~ ^[A-Za-z0-9._-]+\.zip$ ]]
          echo "BUNDLE_NAME=$bundle_name" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 --retry-delay 3 \
            --output "$bundle_name" \
            "http://59.110.144.30:9091/app-update/$bundle_name"

      - name: Download APK
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output Abyssal-Echoes.apk \
            http://59.110.144.30:9091/app-update/Abyssal-Echoes.apk

      - name: Verify release integrity
        run: |
          apk_hash="$(jq -r '.apkSha256 // empty' manifest.json)"
          apk_size="$(jq -r '.apkSize // empty' manifest.json)"
          bundle_hash="$(jq -r '.sha256 // empty' manifest.json)"
          bundle_size="$(jq -r '.size // empty' manifest.json)"
          test -s manifest.sig
          test "$apk_size" = "$(stat -c '%s' Abyssal-Echoes.apk)"
          test "$bundle_size" = "$(stat -c '%s' "$BUNDLE_NAME")"
          printf '%s  %s\n' "$apk_hash" "Abyssal-Echoes.apk" | sha256sum --check --strict
          printf '%s  %s\n' "$bundle_hash" "$BUNDLE_NAME" | sha256sum --check --strict

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resource_version="$(jq -r '.version' manifest.json)"
          gh release create "$GITHUB_REF_NAME" Abyssal-Echoes.apk manifest.json manifest.sig "$BUNDLE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "深渊回响 ${resource_version}" \
            --notes "Android 安装包与签名资源更新。安装后会直接从 GitHub Release 检查后续版本；云存档由 Netlify 按需提供。" \
            --latest
