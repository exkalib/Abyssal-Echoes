<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>深渊回响</title>
  <link rel="stylesheet" href="style.css?v=mapnodes1">
</head>
<body>
  <div id="app">
    <header id="metabar">
      <span id="time">第1天 08:00</span>
      <i class="camera-safe" aria-hidden="true"></i>
      <span id="pt-label">第1周目</span>
    </header>

    <section id="panel"></section>

    <footer id="statusbar">
      <div class="gauge hp">
        <span class="g-ico">❤</span>
        <div class="g-track"><div class="g-fill" id="hp-fill"></div><span class="g-val" id="hp">50/50</span></div>
      </div>
      <button id="set-btn" class="emblem" aria-label="设置">
        <svg class="gear-svg" viewBox="0 0 24 24" aria-hidden="true">
          <g class="gear-shape">
            <rect x="10.5" y="1" width="3" height="5" rx="1"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(45 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(90 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(135 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(180 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(225 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(270 12 12)"/>
            <rect x="10.5" y="1" width="3" height="5" rx="1" transform="rotate(315 12 12)"/>
            <circle cx="12" cy="12" r="7"/>
            <circle class="gear-hole" cx="12" cy="12" r="2.7"/>
          </g>
        </svg>
      </button>
      <div class="gauge sp">
        <div class="g-track"><div class="g-fill" id="st-fill"></div><span class="g-val" id="stamina">50/50</span></div>
        <span class="g-ico">⚡</span>
      </div>
    </footer>

    <main id="log" hidden aria-hidden="true"></main>

    <nav id="tabbar">
      <button data-tab="char" class="tab"><span class="ti">👤</span>角色</button>
      <button data-tab="bag" class="tab"><span class="ti">🎒</span>背包</button>
      <button data-tab="tech" class="tab"><span class="ti">🔬</span>科技</button>
      <button data-tab="task" class="tab"><span class="ti">📋</span>任务</button>
    </nav>
  </div>

  <script src="game.js?v=mapnodes1"></script>
</body>
</html>
